# Reference compose file (architecture.md §7, §9 Risk #5).
#
# IMPORTANT — do not horizontally scale this service. `better-sqlite3` is
# a synchronous, single-process SQLite driver; the "no interleaved
# partial writes" safety property (NFR-6) holds ONLY because Next.js runs
# as exactly one Node process against the DB file. Adding a `replicas:`
# key (Compose) or Node `cluster` mode would allow concurrent writers
# against the same SQLite file and silently corrupt data. There is
# deliberately no `replicas` example anywhere in this file — do not add
# one.
services:
  app:
    build: .
    image: dionysus-planner:latest
    ports:
      - "3000:3000"
    volumes:
      - ./dionysus-data:/data
    environment:
      DB_PATH: /data/dionysus.db
      PORT: "3000"
      NEAR_MATCH_DEFAULT_THRESHOLD: "3"
      # openspec: meal-log-integration — point this at wherever your own
      # dionysus-service instance is running (a separate repo/deployment;
      # not started by this compose file). Without it, /meal-log/* shows a
      # clear error; the rest of the app is unaffected. `localhost` would
      # be THIS container, so the default targets the Docker host via
      # host.docker.internal (mapped below for Linux parity).
      DIONYSUS_SERVICE_URL: "http://host.docker.internal:8080"
      # IANA zone for the Meal Log's "today" and displayed meal times —
      # keep it identical to dionysus-service's DIONYSUS_TZ so both sides
      # agree on where a calendar day begins. Defaults to UTC when unset.
      DIONYSUS_TZ: "America/Toronto"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
